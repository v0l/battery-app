name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.32.2"
  FLUTTER_CHANNEL: "stable"

jobs:
  # ---------------------------------------------------------------- Android ---
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      # cargokit builds the Rust lib during `flutter build`; it adds the
      # Android targets itself via rustup, but needs the toolchain present.
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Build App Bundle (release)
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # -------------------------------------------------------------------- iOS ---
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -y "$GITHUB_WORKSPACE/battery_app-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: battery_app-ios-unsigned.ipa
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS ---
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Build macOS (release)
        run: flutter build macos --release
      - name: Zip .app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/battery_app-macos.zip" battery_app.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: battery_app-macos.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux ---
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Build Linux (release)
        run: flutter build linux --release
      - name: Tar bundle
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/battery_app-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: battery_app-linux-x64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows ---
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Build Windows (release)
        run: flutter build windows --release
      - name: Zip bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath battery_app-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: battery_app-windows-x64.zip
          if-no-files-found: error

  # -------------------------------------------------------------------- Web ---
  # FRB on web compiles the Rust crate to wasm (not handled by cargokit), so
  # this uses the codegen CLI's build-web step. Non-blocking for now.
  web:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - run: flutter pub get
      - name: Build Rust for web (wasm)
        run: flutter_rust_bridge_codegen build-web --release
      - name: Build Web (release)
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          if-no-files-found: error

  # ---------------------------------------------------- Release (on tags) -----
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
