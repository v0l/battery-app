[package]
name = "rust_lib_battery_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
anyhow = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
futures-util = "0.3"

# Desktop: every host-buildable backend (BLE + serial).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
battery_control = { git = "https://github.com/v0l/battery-control", rev = "0b624cbebd0bd0380af2c6b16c442baf12c1f3f0", default-features = false, features = ["full"] }

# Mobile: BLE-only backends (no serial/CAN on iOS; Android serial needs USB-host APIs).
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
battery_control = { git = "https://github.com/v0l/battery-control", rev = "0b624cbebd0bd0380af2c6b16c442baf12c1f3f0", default-features = false, features = ["anker", "jk-ble"] }

# Android: btleplug's droidplug must be initialized with a JNIEnv from the app
# classloader (see src/android_init.rs, called from MainActivity).
[target.'cfg(target_os = "android")'.dependencies]
btleplug = "0.12"
jni = "0.19"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
